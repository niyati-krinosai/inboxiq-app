# Production overrides — used with cloud API URL (Render / Railway / tunnel)
# Usage:
#   $env:API_PUBLIC_URL="https://your-api.onrender.com"
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build

services:
  api:
    environment:
      FRONTEND_URL: https://inboxiq-iota.vercel.app
      CORS_EXTRA_ORIGINS: https://inboxiq-iota.vercel.app
      GOOGLE_REDIRECT_URI: ${API_PUBLIC_URL}/api/v1/auth/callback
